services:
  kinguard:
    build: .
    image: kinguard-py
    container_name: kinguard
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      FALL_THRESHOLD_SECONDS: "2.0"
    volumes:
      # Persist evidence snapshots outside the container.
      - ./evidence:/app/evidence
    restart: unless-stopped
    # To use a camera physically attached to the Docker host instead of a
    # browser webcam, uncomment the following (Linux hosts only):
    # devices:
    #   - /dev/video0:/dev/video0
