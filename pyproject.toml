[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinguard-py"
version = "0.1.0"
description = "Local fall-detection monitor with a live web dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Kinguard" }]
keywords = ["fall-detection", "pose-estimation", "mediapipe", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python-headless>=4.10",
    "mediapipe>=0.10.14",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.400",
]

[project.scripts]
kinguard = "kinguard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kinguard"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
